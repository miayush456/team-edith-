<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One-change-at-a-time training and tuning loop</title>
  <desc id="desc">A circular loop shows baseline, inspect, change one parameter, retrain, and keep or revert.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffcc66"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#10182d"/>
  <text x="48" y="58" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="700">A safe beginner tuning loop</text>
  <text x="48" y="90" fill="#a9b8d4" font-family="sans-serif" font-size="18">Change one thing, make a new run, watch it, and keep evidence.</text>
  <g filter="url(#shadow)">
    <rect x="440" y="132" width="320" height="100" rx="18" fill="#254d48" stroke="#72e6a1" stroke-width="2"/>
    <text x="600" y="171" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="700">1 · Baseline</text>
    <text x="600" y="202" text-anchor="middle" fill="#d9fff0" font-family="sans-serif" font-size="16">Run 256 steps with seed 17.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="832" y="292" width="320" height="100" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="992" y="331" text-anchor="middle" fill="#ffcc66" font-family="sans-serif" font-size="21" font-weight="700">2 · Inspect</text>
    <text x="992" y="362" text-anchor="middle" fill="#a9b8d4" font-family="sans-serif" font-size="16">Replay: crash, speed, steering?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="520" width="320" height="100" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="810" y="559" text-anchor="middle" fill="#ffcc66" font-family="sans-serif" font-size="21" font-weight="700">3 · Change one input</text>
    <text x="810" y="590" text-anchor="middle" fill="#a9b8d4" font-family="sans-serif" font-size="16">Example: off-track weight only.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="520" width="320" height="100" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="390" y="559" text-anchor="middle" fill="#ffcc66" font-family="sans-serif" font-size="21" font-weight="700">4 · Retrain fresh</text>
    <text x="390" y="590" text-anchor="middle" fill="#a9b8d4" font-family="sans-serif" font-size="16">Use a new output folder or seed.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="48" y="292" width="320" height="100" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="208" y="331" text-anchor="middle" fill="#ffcc66" font-family="sans-serif" font-size="21" font-weight="700">5 · Keep or revert</text>
    <text x="208" y="362" text-anchor="middle" fill="#a9b8d4" font-family="sans-serif" font-size="16">Compare Monaco and Spa.</text>
  </g>
  <path d="M760 182 C850 196 918 236 968 284" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1052 394 C1048 460 976 509 962 526" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 584 C603 584 570 584 560 584" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M230 550 C170 512 154 444 164 400" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M290 292 C326 236 391 194 438 181" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="435" y="292" width="330" height="110" rx="16" fill="#263a5d" stroke="#6f8fbd" stroke-width="2"/>
  <text x="600" y="327" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">Good evidence</text>
  <text x="600" y="356" text-anchor="middle" fill="#c8d7ef" font-family="sans-serif" font-size="15">Same maps, same budget,</text>
  <text x="600" y="380" text-anchor="middle" fill="#c8d7ef" font-family="sans-serif" font-size="15">recorded seed and output folder.</text>
  <text x="48" y="680" fill="#a9b8d4" font-family="sans-serif" font-size="17">Do not judge a change from training return alone: replay it and run the deterministic evaluator.</text>
</svg>
