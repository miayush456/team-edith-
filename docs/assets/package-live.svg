<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">From trained run to live inference</title>
  <desc id="desc">Arrows connect a saved training run to a model-only ONNX submission, the Python live runner that supplies the track, and the read-only renderer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffcc66"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="700" fill="#10182d"/>
  <text x="48" y="58" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="700">What happens after training</text>
  <text x="48" y="90" fill="#a9b8d4" font-family="sans-serif" font-size="18">Only the model submission enters the live heat. Python supplies the track and owns the race.</text>
  <g filter="url(#shadow)">
    <rect x="48" y="180" width="230" height="230" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="73" y="222" fill="#ffcc66" font-family="sans-serif" font-size="20" font-weight="700">Saved run</text>
    <text x="73" y="260" fill="#e9eefb" font-family="monospace" font-size="15">policy.pt</text>
    <text x="73" y="288" fill="#e9eefb" font-family="monospace" font-size="15">policy.json</text>
    <text x="73" y="316" fill="#e9eefb" font-family="monospace" font-size="15">training_contract.json</text>
    <text x="73" y="360" fill="#a9b8d4" font-family="sans-serif" font-size="15">Your training evidence.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="342" y="180" width="230" height="230" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="367" y="222" fill="#ffcc66" font-family="sans-serif" font-size="20" font-weight="700">Export</text>
    <text x="367" y="262" fill="#e9eefb" font-family="monospace" font-size="15">model.onnx</text>
    <text x="367" y="290" fill="#e9eefb" font-family="monospace" font-size="15">manifest.json</text>
    <text x="367" y="318" fill="#e9eefb" font-family="monospace" font-size="15">training_contract.json</text>
    <text x="367" y="360" fill="#a9b8d4" font-family="sans-serif" font-size="15">Validated CPU graph.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="636" y="180" width="230" height="230" rx="18" fill="#254d48" stroke="#72e6a1" stroke-width="2"/>
    <text x="661" y="222" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">ONNX submission</text>
    <text x="661" y="262" fill="#d9fff0" font-family="monospace" font-size="15">submission/</text>
    <text x="661" y="290" fill="#d9fff0" font-family="monospace" font-size="15">config/</text>
    <text x="661" y="318" fill="#d9fff0" font-family="monospace" font-size="15">config/</text>
    <text x="661" y="346" fill="#d9fff0" font-family="monospace" font-size="15">package_manifest.json</text>
    <text x="661" y="378" fill="#d9fff0" font-family="sans-serif" font-size="15">No track. No replay.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="180" width="222" height="230" rx="18" fill="#172640" stroke="#4c78a8" stroke-width="2"/>
    <text x="955" y="222" fill="#ffcc66" font-family="sans-serif" font-size="20" font-weight="700">Live heat</text>
    <text x="955" y="265" fill="#e9eefb" font-family="sans-serif" font-size="16">Python supplies:</text>
    <text x="955" y="292" fill="#e9eefb" font-family="sans-serif" font-size="16">event track + config</text>
    <text x="955" y="319" fill="#e9eefb" font-family="sans-serif" font-size="16">fresh model actions</text>
    <text x="955" y="346" fill="#e9eefb" font-family="sans-serif" font-size="16">physics + result</text>
    <text x="955" y="383" fill="#a9b8d4" font-family="sans-serif" font-size="15">Browser only displays state.</text>
  </g>
  <path d="M278 295 L332 295" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M572 295 L626 295" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M866 295 L920 295" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="230" y="500" width="740" height="88" rx="16" fill="#263a5d" stroke="#6f8fbd" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">The package does not contain a race replay</text>
  <text x="600" y="564" text-anchor="middle" fill="#c8d7ef" font-family="sans-serif" font-size="16">The live runner requests fresh ONNX actions while Python advances the supplied track.</text>
  <path d="M600 412 L600 490" fill="none" stroke="#ffcc66" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
